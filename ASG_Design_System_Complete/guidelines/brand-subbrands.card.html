<!-- @dsCard group="Brand" viewport="700x210" name="Sub-Brand Architecture" subtitle="One mark, many domains — only the wordmark changes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-base); display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 36px; }
  .lk { display: flex; align-items: center; gap: 14px; }
  .lk img { height: 52px; flex: none; }
  .wm { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .nm { font-family: var(--font-serif); font-weight: 500; font-size: 17px; letter-spacing: .1em; color: var(--text-primary); line-height: 1; white-space: nowrap; }
  .sub { display: flex; align-items: center; gap: 8px; }
  .sub span { font-family: var(--font-body); font-size: 9.5px; letter-spacing: .3em; color: var(--text-body); white-space: nowrap; }
  .sub i { flex: 1; height: 1px; background: var(--asg-brass); min-width: 14px; }
</style>
</head>
<body>
  <div class="lk"><img src="../assets/logos/asg-icon-white.png" alt=""><div class="wm"><span class="nm">AFRICAN SAFARI</span><span class="sub"><span>GROUP</span><i></i></span></div></div>
  <div class="lk"><img src="../assets/logos/asg-icon-white.png" alt=""><div class="wm"><span class="nm">SABI SAND</span><span class="sub"><span>GAME RESERVE</span><i></i></span></div></div>
  <div class="lk"><img src="../assets/logos/asg-icon-white.png" alt=""><div class="wm"><span class="nm">AMAKHALA</span><span class="sub"><span>GAME RESERVE</span><i></i></span></div></div>
  <div class="lk"><img src="../assets/logos/asg-icon-white.png" alt=""><div class="wm"><span class="nm">ASG DIRECT</span><span class="sub"><span>BOOKINGS</span><i></i></span></div></div>
</body>
</html>
