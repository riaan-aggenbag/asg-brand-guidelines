<!-- @dsCard group="Type" viewport="700x150" name="Eyebrows & Labels" subtitle="Tracked caps — never body text, never below 9pt" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-base); display: flex; flex-direction: column; gap: 18px; }
  .item { display: flex; align-items: center; gap: 18px; }
  .eb { font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .eb.sand { color: var(--accent-quiet); }
  .rule { width: 48px; height: 2px; background: var(--asg-brass); }
  .note { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="item"><span class="eb">Big Five · Malaria-Free</span><span class="rule"></span></div>
  <div class="item"><span class="eb sand">Leopard Capital of Africa</span></div>
  <div class="item"><span class="note">12px · Poppins Medium · 0.22em tracking · brass or heritage sand</span></div>
</body>
</html>
