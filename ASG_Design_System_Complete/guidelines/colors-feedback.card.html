<!-- @dsCard group="Colors" viewport="700x150" name="Semantic / Feedback" subtitle="Warm, restrained status colours — never neon" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-base); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .st { display: flex; align-items: center; gap: 11px; padding: 12px; background: var(--asg-charcoal); border: 1px solid var(--border-default); border-radius: var(--radius-sm); }
  .dot { width: 30px; height: 30px; border-radius: var(--radius-pill); flex: none; }
  .nm { font-family: var(--font-body); font-weight: 600; font-size: 12.5px; color: var(--text-primary); }
  .hx { font-family: var(--font-numeric); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="st"><div class="dot" style="background:var(--success)"></div><div><div class="nm">Success</div><div class="hx">#6E8A5A</div></div></div>
    <div class="st"><div class="dot" style="background:var(--warning)"></div><div><div class="nm">Warning</div><div class="hx">#C08A3E</div></div></div>
    <div class="st"><div class="dot" style="background:var(--danger)"></div><div><div class="nm">Danger</div><div class="hx">#B5524A</div></div></div>
    <div class="st"><div class="dot" style="background:var(--info)"></div><div><div class="nm">Info</div><div class="hx">#C39F77</div></div></div>
  </div>
</body>
</html>
