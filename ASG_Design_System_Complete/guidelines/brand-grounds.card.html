<!-- @dsCard group="Brand" viewport="700x180" name="Logo on Approved Grounds" subtitle="Ink, Ivory, Brass & Heritage Sand — never elsewhere" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--surface-base); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell { aspect-ratio: 1 / 0.78; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-subtle); }
  .cell img { height: 64px; }
  .lab { font-family: var(--font-body); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-top: 7px; }
  .on-ink { background: var(--asg-ink); }
  .on-ivory { background: var(--asg-warm-ivory); }
  .on-brass { background: var(--asg-brass); }
  .on-sand { background: var(--asg-heritage-sand); }
</style>
</head>
<body>
  <div class="row">
    <div><div class="cell on-ink"><img src="../assets/logos/asg-icon-white.png" alt=""></div><div class="lab">On Ink</div></div>
    <div><div class="cell on-ivory"><img src="../assets/logos/asg-icon-ink.png" alt=""></div><div class="lab">On Ivory</div></div>
    <div><div class="cell on-brass"><img src="../assets/logos/asg-icon-ink.png" alt=""></div><div class="lab">On Brass</div></div>
    <div><div class="cell on-sand"><img src="../assets/logos/asg-icon-ink.png" alt=""></div><div class="lab">On Heritage Sand</div></div>
  </div>
</body>
</html>
