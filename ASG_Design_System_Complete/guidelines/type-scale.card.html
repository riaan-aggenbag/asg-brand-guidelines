<!-- @dsCard group="Type" viewport="700x250" name="Type Scale" subtitle="Lora headings → Poppins body, in descending order" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-base); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .line:last-child { border-bottom: 0; }
  .tag { flex: 0 0 64px; font-family: var(--font-numeric); font-size: 11px; color: var(--text-muted); letter-spacing: .04em; }
  .ser { font-family: var(--font-serif); color: var(--text-primary); font-weight: 500; }
  .san { font-family: var(--font-sans); color: var(--text-body); }
</style>
</head>
<body>
  <div class="line"><span class="tag">H1 · 52</span><span class="ser" style="font-size:40px;line-height:1.05">Sabi Sand</span></div>
  <div class="line"><span class="tag">H2 · 40</span><span class="ser" style="font-size:30px">Founders Camp</span></div>
  <div class="line"><span class="tag">H3 · 24</span><span class="ser" style="font-size:22px">The Leopard Capital</span></div>
  <div class="line"><span class="tag">Lead · 19</span><span class="san" style="font-size:18px">Specialists who have stayed at every lodge.</span></div>
  <div class="line"><span class="tag">Body · 16</span><span class="san" style="font-size:16px">Three nights gives you the best odds.</span></div>
  <div class="line"><span class="tag">Caption · 13</span><span class="san" style="font-size:13px;color:var(--text-muted)">From R 14,500 pp / night</span></div>
</body>
</html>
