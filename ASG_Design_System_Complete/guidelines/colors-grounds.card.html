<!-- @dsCard group="Colors" viewport="700x172" name="Primary Grounds" subtitle="Ink & charcoal — the dominant 60%" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-ivory); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--asg-bone); }
  .chip { height: 84px; }
  .meta { padding: 10px 12px; background: var(--asg-white); }
  .nm { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--text-primary-ink); }
  .hx { font-family: var(--font-numeric); font-size: 12px; color: var(--text-muted-ink); letter-spacing: .02em; }
  .use { font-family: var(--font-body); font-size: 11px; color: var(--text-muted-ink); margin-top: 2px; line-height: 1.35; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#171411"></div><div class="meta"><div class="nm">ASG Ink</div><div class="hx">#171411</div><div class="use">Primary ground</div></div></div>
    <div class="sw"><div class="chip" style="background:#2B2622"></div><div class="meta"><div class="nm">Charcoal</div><div class="hx">#2B2622</div><div class="use">Dark UI, panels</div></div></div>
    <div class="sw"><div class="chip" style="background:#4A443C"></div><div class="meta"><div class="nm">Soft Charcoal</div><div class="hx">#4A443C</div><div class="use">Body on light</div></div></div>
  </div>
</body>
</html>
