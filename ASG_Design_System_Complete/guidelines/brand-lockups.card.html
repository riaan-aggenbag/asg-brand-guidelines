<!-- @dsCard group="Brand" viewport="700x230" name="Logo Lockups" subtitle="Stacked, horizontal & icon-only — the mark is fixed" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 30px; background: var(--surface-base); display: flex; align-items: center; gap: 44px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cell img { display: block; }
  .lab { font-family: var(--font-body); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
  .div { width: 1px; align-self: stretch; background: var(--border-default); }
</style>
</head>
<body>
  <div class="cell"><img src="../assets/logos/asg-stacked-white.png" alt="ASG stacked" height="118"><span class="lab">Master — original, unaltered</span></div>
  <div class="div"></div>
  <div class="cell">
    <img src="../assets/logos/asg-horizontal-white.webp" alt="African Safari Group horizontal lockup" height="46">
    <span class="lab">Horizontal — preferred for nav</span>
  </div>
  <div class="div"></div>
  <div class="cell"><img src="../assets/logos/asg-icon-white.png" alt="ASG icon only" height="68"><span class="lab">Icon only</span></div>
</body>
</html>
