<!-- @dsCard group="Colors" viewport="700x172" name="Warm Neutrals" subtitle="Light grounds, heritage tone & hairlines — the 30%" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-base); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-default); }
  .chip { height: 76px; }
  .meta { padding: 9px 11px; background: var(--asg-charcoal); }
  .nm { font-family: var(--font-body); font-weight: 600; font-size: 12.5px; color: var(--text-primary); }
  .hx { font-family: var(--font-numeric); font-size: 11px; color: var(--text-muted); letter-spacing: .02em; }
  .use { font-family: var(--font-body); font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--asg-heritage-sand)"></div><div class="meta"><div class="nm">Heritage Sand</div><div class="hx">#C39F77</div><div class="use">Tints only</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--asg-warm-ivory)"></div><div class="meta"><div class="nm">Warm Ivory</div><div class="hx">#F6F1EA</div><div class="use">Light ground</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--asg-bone)"></div><div class="meta"><div class="nm">Bone</div><div class="hx">#B9AFA2</div><div class="use">Dividers</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--asg-sand-tint)"></div><div class="meta"><div class="nm">Sand Tint</div><div class="hx">#E8DCCB</div><div class="use">Soft fills</div></div></div>
  </div>
</body>
</html>
