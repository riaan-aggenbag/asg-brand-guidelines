<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base unit — generous, editorial rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--surface-base); display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .bar { height: 16px; background: var(--asg-brass); border-radius: 1px; }
  .tok { flex: 0 0 70px; font-family: var(--font-numeric); font-size: 12px; color: var(--text-body); }
  .px { font-family: var(--font-numeric); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row"><span class="tok">space-2</span><span class="bar" style="width:8px"></span><span class="px">8</span></div>
  <div class="row"><span class="tok">space-4</span><span class="bar" style="width:16px"></span><span class="px">16</span></div>
  <div class="row"><span class="tok">space-5</span><span class="bar" style="width:24px"></span><span class="px">24</span></div>
  <div class="row"><span class="tok">space-6</span><span class="bar" style="width:32px"></span><span class="px">32</span></div>
  <div class="row"><span class="tok">space-7</span><span class="bar" style="width:48px"></span><span class="px">48</span></div>
  <div class="row"><span class="tok">space-9</span><span class="bar" style="width:96px"></span><span class="px">96 · section</span></div>
</body>
</html>
