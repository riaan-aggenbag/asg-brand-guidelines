<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-base); display: flex; gap: 14px; }
  .card { flex: 1; background: var(--surface-raised); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 18px 20px; box-shadow: var(--shadow-md); }
  .eyebrow { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  h3 { font-family: var(--font-serif); font-weight: 500; font-size: 24px; color: var(--text-primary); margin: 8px 0 6px; }
  p { font-family: var(--font-body); font-size: 13.5px; line-height: 1.6; color: var(--text-body); margin: 0; max-width: 36ch; }
  .swatches { display: flex; flex-direction: column; gap: 8px; flex: 0 0 150px; }
  .sw { display: flex; align-items: center; gap: 10px; font-family: var(--font-body); font-size: 11.5px; color: var(--text-body); }
  .chip { width: 30px; height: 30px; border-radius: var(--radius-xs); border: 1px solid var(--border-default); flex: none; }
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Sabi Sand · South Africa</span>
    <h3>The Leopard Capital</h3>
    <p>The highest leopard-sighting density in Africa. Three nights gives you the best odds.</p>
  </div>
  <div class="swatches">
    <div class="sw"><span class="chip" style="background:var(--asg-warm-ivory)"></span>Ground · Ivory</div>
    <div class="sw"><span class="chip" style="background:var(--asg-white)"></span>Raised · White</div>
    <div class="sw"><span class="chip" style="background:var(--asg-ink)"></span>Text · Ink</div>
    <div class="sw"><span class="chip" style="background:var(--asg-brass)"></span>Signal · Brass</div>
  </div>
</body>
</html>
