<!-- @dsCard group="Type" viewport="700x160" name="Numerals Are Always Poppins" subtitle="Prices, dates & stats stay Poppins-Medium, even in serif" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--surface-base); display: flex; gap: 34px; align-items: center; }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .n { font-family: var(--font-numeric); font-weight: 500; font-size: 34px; color: var(--accent); line-height: 1; font-feature-settings: "tnum" 1; }
  .l { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); letter-spacing: .04em; }
  .div { width: 1px; align-self: stretch; background: var(--border-default); }
</style>
</head>
<body>
  <div class="stat"><span class="n">R 14,500</span><span class="l">pp / night</span></div>
  <div class="div"></div>
  <div class="stat"><span class="n">5</span><span class="l">lodges available</span></div>
  <div class="div"></div>
  <div class="stat"><span class="n">Oct 2026</span><span class="l">best season</span></div>
</body>
</html>
