<!-- @dsCard group="Type" viewport="700x190" name="Lora — Display & Headlines" subtitle="The serif moment. Short, confident, one per screen." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--surface-base); }
  .disp { font-family: var(--font-serif); font-weight: 500; font-size: 52px; line-height: 1.02; letter-spacing: -.015em; color: var(--text-primary); margin: 0; }
  .disp em { font-style: italic; color: var(--accent-quiet); }
  .meta { margin-top: 16px; font-family: var(--font-body); font-size: 12px; color: var(--text-muted); letter-spacing: .04em; }
</style>
</head>
<body>
  <p class="disp">Your Africa,<br><em>Considered.</em></p>
  <div class="meta">Lora · Medium 500 &amp; Italic · −0.015em tracking</div>
</body>
</html>
