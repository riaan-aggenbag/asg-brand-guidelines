<!-- @dsCard group="Flagship Website" viewport="1440x1020" name="Flagship — Editorial (blend)" subtitle="Dark chrome, layered light body, dark footer — all pages" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>African Safari Group — Editorial</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--asg-ink); }

  /* ---- Photography slot (dark by default; light inside light bands) ---- */
  .photo-slot{position:relative;background:radial-gradient(120% 90% at 70% 10%, #241f19 0%, #171411 55%, #0e0c0a 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .photo-slot::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg, rgba(168,121,75,.05) 0 2px, transparent 2px 9px);opacity:.5;}
  .photo-slot__tag{position:relative;font-family:var(--font-body);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);display:flex;align-items:center;gap:9px;text-align:center;padding:0 16px;}
  .photo-slot__tag .dot{width:5px;height:5px;border-radius:50%;background:var(--asg-brass);opacity:.7;flex:none;}
  [data-theme="light"] .photo-slot{background:linear-gradient(135deg,#ece2d4 0%,#ddd0bb 100%);}
  [data-theme="light"] .photo-slot::before{opacity:.3;}
  [data-theme="light"] .photo-slot__tag{color:#9a8f7e;}

  /* ---- Dark nav ---- */
  .eb-nav{position:sticky;top:0;z-index:120;background:rgba(14,12,10,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle);}
  .eb-nav__in{max-width:var(--container-wide);margin:0 auto;padding:0 var(--gutter);height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .eb-nav__links{display:flex;align-items:center;gap:28px;}
  .eb-nav__links a{font-family:var(--font-body);font-size:12px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--text-body);cursor:pointer;transition:color .15s;white-space:nowrap;}
  .eb-nav__links a:hover,.eb-nav__links a.on{color:var(--text-primary);}
  .eb-logo{cursor:pointer;display:inline-flex;}
  .eb-nav__actions{display:flex;align-items:center;gap:12px;}
  .eb-burger{display:none;}
  @media (max-width:1080px){.eb-nav__links{display:none;}.eb-burger{display:inline-flex;}}
  @media (max-width:560px){.eb-cta-desktop{display:none;}}
  .eb-drawer-links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
  .eb-drawer-links a{display:block;padding:15px 0;font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--text-body);border-bottom:1px solid var(--border-subtle);cursor:pointer;transition:color .15s;}
  .eb-drawer-links a:hover,.eb-drawer-links a.on{color:var(--text-primary);}
  .eb-drawer-contact{margin:20px 0 0;font-family:var(--font-body);font-size:13px;line-height:1.8;color:var(--text-muted);}

  /* ---- Heroes ---- */
  .hero{position:relative;display:flex;align-items:flex-end;}
  .hero--tall{min-height:78vh;}
  .hero--mid{min-height:56vh;}
  .hero--short{min-height:42vh;}
  .hero .photo-slot{position:absolute;inset:0;}
  .hero::after{content:"";position:absolute;inset:0;background:var(--scrim-full);}
  .hero__in{position:relative;z-index:2;max-width:var(--container-wide);margin:0 auto;width:100%;padding:0 var(--gutter) 72px;}
  .hero__in--tall{padding-bottom:82px;}
  .hero h1{font-family:var(--font-serif);font-weight:500;line-height:1.02;letter-spacing:-.015em;color:var(--asg-warm-ivory);margin:16px 0 0;}
  .hero--tall h1{font-size:clamp(2.8rem,1.6rem+4.4vw,4.6rem);max-width:16ch;}
  .hero--mid h1{font-size:clamp(2.4rem,1.6rem+3.4vw,4rem);max-width:18ch;}
  .hero--short h1{font-size:clamp(2rem,1.5rem+2.4vw,3.2rem);max-width:20ch;}
  .hero h1 em{font-style:italic;color:var(--asg-heritage-sand);}
  .hero__lead{margin:20px 0 28px;font-family:var(--font-body);font-size:19px;line-height:1.5;color:var(--text-body);max-width:52ch;}
  .hero__cta{display:flex;gap:14px;flex-wrap:wrap;}
  .hero__meta{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .hero__crumbs{display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13px;color:var(--text-muted);}
  .hero__crumbs a{color:var(--text-muted);cursor:pointer;}
  .hero__crumbs a:hover{color:var(--accent-hover);}
  .hero__crumbs .sep{opacity:.5;}

  /* ---- Bands ---- */
  .band{display:block;padding:88px var(--gutter);}
  .band--tight{padding:64px var(--gutter);}
  .band__in{max-width:var(--container-wide);margin:0 auto;}
  .band__in--text{max-width:var(--container-max);}
  .band--ivory{background:var(--asg-warm-ivory);}
  .band--white{background:var(--asg-white);}
  .band--sand{background:var(--asg-sand-tint);}
  .band--dark{background:var(--asg-charcoal);}
  .band--ink{background:var(--asg-ink);}

  .eyebrow{font-family:var(--font-body);font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);}
  .rule{width:56px;height:2px;background:var(--asg-brass);border:0;margin:16px 0 0;}
  .sec-head{display:flex;flex-direction:column;gap:13px;margin-bottom:44px;}
  .sec-head--center{align-items:center;text-align:center;}
  .sec-head h2{font-family:var(--font-serif);font-weight:500;font-size:clamp(1.9rem,1.4rem+1.9vw,2.9rem);line-height:1.1;color:var(--text-primary);margin:0;max-width:22ch;letter-spacing:-.01em;}
  .sec-head p{font-family:var(--font-body);margin:0;color:var(--text-body);font-size:16px;max-width:60ch;line-height:1.65;}

  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;}
  @media (max-width:980px){.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
  @media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  /* value / feature tiles */
  .tile{display:flex;flex-direction:column;gap:12px;}
  .tile__ic{color:var(--accent);}
  .tile h4{font-family:var(--font-serif);font-weight:500;font-size:21px;color:var(--text-primary);margin:0;}
  .tile p{font-family:var(--font-body);font-size:14px;line-height:1.6;color:var(--text-muted);margin:0;}

  /* split feature (image + body) */
  .feature{display:grid;grid-template-columns:1.05fr 1fr;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-default);}
  .feature--rev{grid-template-columns:1fr 1.05fr;}
  .feature__media{min-height:420px;position:relative;}
  .feature__body{padding:60px;display:flex;flex-direction:column;justify-content:center;gap:16px;}
  .feature__body h2{font-family:var(--font-serif);font-weight:500;font-size:clamp(1.8rem,1.4rem+1.5vw,2.5rem);line-height:1.14;color:var(--text-primary);margin:0;max-width:18ch;letter-spacing:-.01em;}
  .feature__body p{font-family:var(--font-body);margin:0;color:var(--text-body);font-size:16px;line-height:1.65;max-width:46ch;}
  .feature__who{display:flex;align-items:center;gap:14px;margin-top:6px;}
  .feature__who b{font-family:var(--font-body);font-size:14px;color:var(--text-primary);font-weight:600;display:block;}
  .feature__who span{font-family:var(--font-body);font-size:13px;color:var(--text-muted);}
  @media (max-width:900px){.feature,.feature--rev{grid-template-columns:1fr;}.feature__media{min-height:280px;}.feature__body{padding:38px;}}

  /* quote + stats */
  .quote{max-width:var(--container-text);margin:0 auto;text-align:center;}
  .quote p{font-family:var(--font-serif);font-style:italic;font-size:clamp(1.5rem,1.2rem+1.3vw,2.1rem);line-height:1.38;color:var(--text-primary);margin:24px 0 0;}
  .quote cite{display:block;margin-top:20px;font-style:normal;font-family:var(--font-body);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);}
  .statsrow{display:flex;justify-content:center;gap:64px;flex-wrap:wrap;}
  .statsrow--mt{margin-top:60px;}

  /* two-column article (prose + aside) */
  .article{display:grid;grid-template-columns:1.5fr 1fr;gap:52px;align-items:start;}
  @media (max-width:900px){.article{grid-template-columns:1fr;gap:30px;}}
  .prose p{font-family:var(--font-body);font-size:16.5px;line-height:1.75;color:var(--text-body);max-width:64ch;}
  .prose h3{font-family:var(--font-serif);font-weight:500;font-size:24px;color:var(--text-primary);margin:34px 0 12px;}
  .aside{background:var(--asg-charcoal);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:28px;}
  .aside h4{font-family:var(--font-body);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin:0 0 16px;}
  .aside__row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--border-subtle);}
  .aside__row:last-of-type{border-bottom:0;}
  .aside__row .ic{color:var(--accent);flex:none;}
  .aside__row b{display:block;font-family:var(--font-body);font-size:14px;color:var(--text-primary);font-weight:600;}
  .aside__row span{font-family:var(--font-body);font-size:12.5px;color:var(--text-muted);}

  /* gallery (lodge) */
  .gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:160px 160px;gap:10px;border-radius:var(--radius-md);overflow:hidden;}
  .gallery .g0{grid-row:span 2;}
  .gallery .photo-slot{border-radius:0;}
  @media (max-width:760px){.gallery{grid-template-columns:1fr 1fr;grid-template-rows:130px 130px;}.gallery .g0{grid-row:span 1;grid-column:span 2;}}

  /* filters row */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}

  /* enquiry */
  .enq{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:start;}
  @media (max-width:900px){.enq{grid-template-columns:1fr;gap:34px;}}
  .enq__steps{display:flex;flex-direction:column;gap:20px;margin-top:32px;}
  .enq__step{display:flex;gap:16px;align-items:flex-start;}
  .enq__step .n{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--asg-brass-a40);color:var(--accent);font-family:var(--font-numeric);font-weight:500;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .enq__step b{display:block;font-family:var(--font-body);font-size:15px;color:var(--text-primary);font-weight:600;}
  .enq__step span{font-family:var(--font-body);font-size:14px;color:var(--text-muted);line-height:1.55;}
  .enq__form{background:var(--asg-white);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:36px;box-shadow:var(--shadow-ivory-md);}
  .enq__form h3{font-family:var(--font-serif);font-weight:500;font-size:22px;color:var(--text-primary);margin:0 0 22px;}
  .enq__row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .enq__field{margin-bottom:14px;}

  /* rate card (lodge) */
  .rate{background:var(--asg-white);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:26px;box-shadow:var(--shadow-ivory-md);position:sticky;top:96px;}
  .rate__price{display:flex;align-items:baseline;gap:8px;}
  .rate__price b{font-family:var(--font-numeric);font-weight:500;font-size:30px;color:var(--text-primary);}
  .rate__price span{font-family:var(--font-body);font-size:13px;color:var(--text-muted);}
  .rate__line{display:flex;justify-content:space-between;font-family:var(--font-body);font-size:14px;color:var(--text-body);padding:10px 0;border-bottom:1px solid var(--border-subtle);}
  .rate__line span:last-child{font-family:var(--font-numeric);color:var(--text-primary);}
  .rate__note{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--text-muted);font-family:var(--font-body);font-size:12px;line-height:1.5;}
  .rate__note .ic{color:var(--accent);flex:none;margin-top:1px;}

  /* ---- Dark footer ---- */
  .eb-foot{background:var(--asg-ink-900);border-top:1px solid var(--border-subtle);}
  .eb-foot__in{max-width:var(--container-wide);margin:0 auto;padding:60px var(--gutter) 38px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;}
  .eb-foot h5{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin:0 0 18px;}
  .eb-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;}
  .eb-foot a{font-family:var(--font-body);font-size:14px;color:var(--text-body);cursor:pointer;transition:color .15s;}
  .eb-foot a:hover{color:var(--accent-hover);}
  .eb-foot__brand p{font-family:var(--font-body);font-size:13.5px;line-height:1.7;color:var(--text-muted);max-width:34ch;margin:18px 0 0;}
  .eb-foot__bar{max-width:var(--container-wide);margin:0 auto;padding:22px var(--gutter);border-top:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .eb-foot__bar span{font-family:var(--font-body);font-size:12px;color:var(--text-faint);letter-spacing:.04em;}
  @media (max-width:900px){.eb-foot__in{grid-template-columns:1fr 1fr;}}

  /* ---- Page switcher ---- */
  .switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:1300;display:flex;gap:3px;padding:5px;border-radius:999px;background:rgba(14,12,10,.86);backdrop-filter:blur(10px);border:1px solid var(--border-default);box-shadow:var(--shadow-lg);max-width:94vw;overflow-x:auto;}
  .switch button,.switch a{font-family:var(--font-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);background:none;border:0;padding:8px 13px;border-radius:999px;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap;text-decoration:none;}
  .switch button:hover,.switch a:hover{color:var(--text-body);}
  .switch button.on{background:var(--asg-brass-600);color:var(--text-on-brass);}
  .switch .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--border-default);flex:none;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="editorial/EdChrome.jsx"></script>
<script type="text/babel" src="editorial/EdPagesA.jsx"></script>
<script type="text/babel" src="editorial/EdPagesB.jsx"></script>
<script type="text/babel">
  const { EbNav, EbFooter } = window;
  const KEY = "asg-editorial-route";
  const PAGES = [
    ["home","Home"],["destinations","Destinations"],["reserve","Reserve"],
    ["experiences","Experiences"],["accommodation","Accommodation"],
    ["lodge","Lodge"],["about","About"],["enquire","Enquiry"],
  ];
  function App() {
    const [route, setRoute] = React.useState(() => localStorage.getItem(KEY) || "home");
    const go = React.useCallback((r) => { setRoute(r); localStorage.setItem(KEY, r); window.scrollTo({top:0,behavior:"auto"}); }, []);
    const Screen = {
      home: window.EdHome, destinations: window.EdDestinations, reserve: window.EdReserve,
      experiences: window.EdExperiences, accommodation: window.EdAccommodation,
      lodge: window.EdLodge, about: window.EdAbout, enquire: window.EdEnquire,
    }[route] || window.EdHome;
    return (
      <React.Fragment>
        <EbNav route={route} go={go} />
        <Screen go={go} />
        <EbFooter go={go} />
        <div className="switch">
          {PAGES.map(([id,label]) => <button key={id} className={route===id?"on":""} onClick={() => go(id)}>{label}</button>)}
          <span className="sep"></span>
          <a href="index.html">Dark / Light</a>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
