<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 28px; background: var(--surface-base); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 40px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Textarea, Select, Checkbox, Radio, Switch } = window.DesignSystem_e5ff94;
  function Demo() {
    return (
      <div className="cols">
        <div className="stack">
          <Input label="Full name" placeholder="Sarah Kruger" required />
          <Input label="Search lodges" icon="search" placeholder="Sabi Sand…" />
          <Input label="Travel dates" defaultValue="Octobr" error="Please choose valid dates" />
          <Select label="Reserve" placeholder="Choose a reserve" options={["Sabi Sand","Amakhala","Madikwe"]} />
        </div>
        <div className="stack">
          <Textarea label="Tell us about your trip" rows={3} placeholder="Who's travelling, and when?" />
          <div className="stack" style={{gap:'12px'}}>
            <Checkbox label="Malaria-free reserves only" defaultChecked />
            <Checkbox label="Add a private guide" description="Dedicated ranger & vehicle" />
          </div>
          <div className="stack" style={{gap:'12px'}}>
            <Radio name="board" label="Full board" defaultChecked />
            <Radio name="board" label="All inclusive" description="Drinks & game drives included" />
          </div>
          <Switch label="Flexible dates" defaultChecked />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
