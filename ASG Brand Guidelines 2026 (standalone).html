px;\">The card is where the dark brand shows best. <strong>One side carries the person; the other, the logo<\u002Fstrong> — 90 × 55 mm, rounded 3 mm corners optional.<\u002Fp>\n    <div class=\"mock-wrap\" style=\"justify-content:center;gap:26px;margin-top:20px;\">\n      <div><div class=\"bc front shadow\"><div><div class=\"nm\">Amara Ndlovu<\u002Fdiv><div class=\"ti\">Safari Specialist<\u002Fdiv><\u002Fdiv><div class=\"cd\">+27 21 555 0148<br>amara@africansafarigroup.com<br>africansafarigroup.com<\u002Fdiv><\u002Fdiv><\u002Fdiv><p class=\"mock-cap\">Front — name, title &amp; details<\u002Fp><\u002Fdiv>\n      <div><div class=\"bc back shadow\"><img src=\"75518738-a80e-456d-836f-07d8ab5c78a5\" alt=\"\"><\u002Fdiv><p class=\"mock-cap\">Back — full logo<\u002Fp><\u002Fdiv>\n    <\u002Fsection><\u002Fdiv>\n    <div class=\"dd\" style=\"margin-top:24px;\">\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Do<\u002Fb><\u002Fdiv>\n        <ul><li>Name in Lora, title in tracked Poppins caps<\u002Fli><li>Keep the reverse to the logo alone<\u002Fli><li>Print on uncoated or soft-touch matte stock<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Don't<\u002Fb><\u002Fdiv>\n        <ul><li>Crowd both sides with information<\u002Fli><li>Use glossy UV or rainbow foil<\u002Fli><li>Add social icons or QR codes to the front<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>21<\u002Fspan><\u002Fdiv>\n  \n\n  <!-- ============ 22 · FOLDERS & FILES ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Folders &amp; files\">\n    <div class=\"rhead\"><span class=\"sans-cap\">05 · Applications<\u002Fspan><span class=\"sans-cap\">Folders &amp; files<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Folders &amp; files<\u002Fp>\n    <h2 class=\"h-page\">Folders, files &amp; documents<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:14px;\">Presentation folders and covers are the one place the <strong>full dark treatment<\u002Fstrong> belongs — a deep ink ground, centred crest, single brass rule. Internal documents stay light for readability.<\u002Fp>\n    <div class=\"mock-wrap\" style=\"justify-content:center;gap:30px;margin-top:20px;\">\n      <div><div class=\"folder shadow\"><img src=\"75518738-a80e-456d-836f-07d8ab5c78a5\" alt=\"\"><div class=\"fr\"><\u002Fdiv><div class=\"ft\">Itineraries<\u002Fdiv><\u002Fdiv><p class=\"mock-cap\">A4 presentation folder — Ink<\u002Fp><\u002Fdiv>\n      <div><div class=\"doc shadow\"><img src=\"98920c08-a6d5-47dc-9d3a-48825c881d7f\" alt=\"\"><div class=\"dt\">Your Safari Itinerary<\u002Fdiv><div class=\"de\">Prepared for you<\u002Fdiv><div class=\"dr\"><\u002Fdiv><div class=\"bar\" style=\"width:100%;\"><\u002Fdiv><div class=\"bar\" style=\"width:92%;\"><\u002Fdiv><div class=\"bar\" style=\"width:96%;\"><\u002Fdiv><div class=\"bar\" style=\"width:70%;\"><\u002Fdiv><div style=\"height:8px;\"><\u002Fdiv><div class=\"bar\" style=\"width:88%;\"><\u002Fdiv><div class=\"bar\" style=\"width:100%;\"><\u002Fdiv><\u002Fdiv><p class=\"mock-cap\">Document / report — Ink on White<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dd\" style=\"margin-top:22px;\">\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Do<\u002Fb><\u002Fdiv>\n        <ul><li>Covers &amp; folders: dark ink, centred crest<\u002Fli><li>Interior document pages: ink on white<\u002Fli><li>Name files clearly — brand, document, date<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Don't<\u002Fb><\u002Fdiv>\n        <ul><li>Set long body copy on a dark ground<\u002Fli><li>Mix multiple accent colours on a cover<\u002Fli><li>Stretch the crest to fill the folder<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>22<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 23 · WEBSITES ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Websites\">\n    <div class=\"rhead\"><span class=\"sans-cap\">05 · Applications<\u002Fspan><span class=\"sans-cap\">Websites<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Digital<\u002Fp>\n    <h2 class=\"h-page\">Websites<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:14px;\">Sites lead with a <strong>dark cinematic hero<\u002Fstrong>, one serif headline and a single brass call-to-action. Body content sits on ivory for reading. The 60 / 30 / 10 rule governs every screen.<\u002Fp>\n    <div class=\"mock-wrap\" style=\"justify-content:center;margin-top:20px;\">\n      <div><div class=\"web shadow\"><div class=\"wbar\"><img src=\"04963c5a-9ea3-4007-9115-6d4e6f9af260\" alt=\"\"><div class=\"wnav\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><\u002Fdiv><div class=\"whero\"><div class=\"we\">Sabi Sand · Malaria-free<\u002Fdiv><div class=\"wh\">Where lions still rule<\u002Fdiv><div class=\"wc\"><\u002Fdiv><\u002Fdiv><div class=\"wbody\"><div class=\"wt\"><\u002Fdiv><div class=\"wt\"><\u002Fdiv><div class=\"wt\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><p class=\"mock-cap\">Homepage — dark hero, light body<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dd\" style=\"margin-top:22px;\">\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Do<\u002Fb><\u002Fdiv>\n        <ul><li>One primary brass CTA per screen<\u002Fli><li>Near-square corners, hairline borders<\u002Fli><li>Text over photos on a dark scrim<\u002Fli><li>Generous whitespace between sections<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Don't<\u002Fb><\u002Fdiv>\n        <ul><li>Use bright gradients or heavy drop-shadows<\u002Fli><li>Fill sections with brass backgrounds<\u002Fli><li>Stack multiple competing CTAs<\u002Fli><li>Use rounded \"bubbly\" buttons or emoji<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>23<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 24 · NEWSLETTERS ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Newsletters\">\n    <div class=\"rhead\"><span class=\"sans-cap\">05 · Applications<\u002Fspan><span class=\"sans-cap\">Newsletters<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Email<\u002Fp>\n    <h2 class=\"h-page\">Newsletters &amp; email<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"col2u\" style=\"margin-top:18px;align-items:start;\">\n      <div class=\"mock-wrap\" style=\"justify-content:center;\">\n        <div><div class=\"nl shadow\"><div class=\"nh\"><img src=\"04963c5a-9ea3-4007-9115-6d4e6f9af260\" alt=\"\"><\u002Fdiv><div class=\"nhero\"><\u002Fdiv><div class=\"nbody\"><div class=\"ne\">Field notes · October<\u002Fdiv><div class=\"nt\">The green season, quietly<\u002Fdiv><div class=\"bar\" style=\"width:100%;\"><\u002Fdiv><div class=\"bar\" style=\"width:94%;\"><\u002Fdiv><div class=\"bar\" style=\"width:98%;\"><\u002Fdiv><div class=\"bar\" style=\"width:64%;\"><\u002Fdiv><div class=\"ncta\"><\u002Fdiv><\u002Fdiv><div class=\"nfoot\"><span class=\"fill\">14 Green Way, Gordon's Bay, Cape Town<\u002Fspan><br>Unsubscribe · africansafarigroup.com<\u002Fdiv><\u002Fdiv><p class=\"mock-cap\">Email newsletter — single column<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stack\">\n        <p style=\"font-size:11.5px;\">Email is a <strong>single narrow column<\u002Fstrong> — a dark header with the horizontal logo, one cinematic image, a serif headline, short editorial copy and a single brass button. Restraint reads as premium in the inbox.<\u002Fp>\n        <div class=\"dd\" style=\"grid-template-columns:1fr;gap:12px;\">\n          <div class=\"dd-card dd-do\"><div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Do<\u002Fb><\u002Fdiv><ul><li>One image, one headline, one CTA<\u002Fli><li>Dark header, ivory/white body<\u002Fli><li>Include physical address &amp; unsubscribe<\u002Fli><\u002Ful><\u002Fdiv>\n          <div class=\"dd-card dd-no\"><div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Don't<\u002Fb><\u002Fdiv><ul><li>Multi-column, busy promo layouts<\u002Fli><li>Multiple CTAs or discount shouting<\u002Fli><li>Emoji in subject lines or body<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>24<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 25 · QUICK REFERENCE ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Quick reference\">\n    <div class=\"rhead\"><span class=\"sans-cap\">Quick reference<\u002Fspan><span class=\"sans-cap\">Do &amp; Don't<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">At a glance<\u002Fp>\n    <h2 class=\"h-page\">The essentials<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"dd\" style=\"margin-top:20px;\">\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Always<\u002Fb><\u002Fdiv>\n        <ul>\n          <li>Hold to 60 / 30 / 10 — ink, ivory, brass<\u002Fli>\n          <li>Use brass sparingly, as a signal<\u002Fli>\n          <li>Keep the crest fixed &amp; give it clear space<\u002Fli>\n          <li>Set headlines in Lora, everything else in Poppins<\u002Fli>\n          <li>Write specific, calm, declarative copy<\u002Fli>\n          <li>Choose restraint and negative space<\u002Fli>\n          <li>Cite accreditations on formal materials<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Never<\u002Fb><\u002Fdiv>\n        <ul>\n          <li>Use brass as a large background<\u002Fli>\n          <li>Recolour, stretch, rotate or shadow the crest<\u002Fli>\n          <li>Introduce a third typeface or new colours<\u002Fli>\n          <li>Use bright / neon colours or heavy gradients<\u002Fli>\n          <li>Use exclamation points or emoji<\u002Fli>\n          <li>Set long body copy on dark grounds<\u002Fli>\n          <li>Crowd a layout — density reads as cheap<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\" style=\"margin-top:22px;\"><p class=\"serif-it\" style=\"font-size:15px;color:var(--ink);\">\"When in doubt, choose restraint — fewer colours, more space, one clear message.\"<\u002Fp><\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>25<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 26 · BACK COVER ============ -->\n  <section class=\"sheet dark\" data-screen-label=\"Back cover\" style=\"display:flex;flex-direction:column;justify-content:space-between;padding:26mm 22mm;\">\n    <div>\n      <img src=\"91fe02c5-283e-4eb6-9171-d91fd48f10ee\" alt=\"\" style=\"height:54px;\">\n      <p class=\"ey\" style=\"margin-top:24px;\">Questions &amp; assets<\u002Fp>\n      <h2 style=\"font-size:30px;color:var(--ivory);margin-top:10px;\">Keep the brand consistent<\u002Fh2>\n      <div class=\"cover-rule\" style=\"margin:18px 0 0 0;\"><\u002Fdiv>\n      <p style=\"color:#C9C0B4;font-size:12.5px;margin-top:18px;max-width:52ch;\">For logo files, templates or anything not covered here, contact the team before improvising. Consistency is the brand's greatest asset.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <p class=\"ey\" style=\"margin-bottom:12px;\">Accreditations<\u002Fp>\n      <div class=\"accs\">\n        <div class=\"acc\"><b>SATSA<\u002Fb><span>Member 3099 · Southern Africa Tourism Services Association<\u002Fspan><\u002Fdiv>\n        <div class=\"acc\"><b>Atta<\u002Fb><span>African Travel &amp; Tourism Association<\u002Fspan><\u002Fdiv>\n        <div class=\"acc\"><b>Cape Town Tourism<\u002Fb><span>Classic Tier member<\u002Fspan><\u002Fdiv>\n        <div class=\"acc\"><b>Tripadvisor<\u002Fb><span>Listed operator<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(246,241,234,.16);padding-top:20px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;\">\n      <div>\n        <p class=\"sans-cap\" style=\"color:var(--brass-400);margin-bottom:8px;\">African Safari Group<\u002Fp>\n        <p style=\"font-family:var(--sans);font-size:11px;color:var(--bone);line-heig
