  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>African Safari Group — Brand Guidelines 2026<\u002Ftitle>\n<style>/* African Safari Group — Design System\n   Single global-CSS entry point. Consumers link THIS file.\n   Import order: fonts → tokens → base. */\n\n/* African Safari Group — Webfonts\n   Lora (serif, display/headlines) + Poppins (sans, body/UI).\n   Both are the exact brand fonts, self-hosted (latin subset). */\n\n/* Lora — variable upright, covers 400–700 */\n@font-face {\n  font-family: \"Lora\";\n  font-style: normal;\n  font-weight: 400 700;\n  font-display: swap;\n  src: url(\"7d9e32c5-237f-4b8c-920c-06c865ce6c06\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Lora\";\n  font-style: italic;\n  font-weight: 400 700;\n  font-display: swap;\n  src: url(\"2dc4ca80-f4df-4d42-bb18-fd244c75d9d3\") format(\"woff2\");\n}\n\n/* Poppins — discrete weights */\n@font-face {\n  font-family: \"Poppins\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1ef778f0-dade-42aa-ad0c-2043b3868843\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Poppins\";\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e79fa322-4f42-4180-90c2-55ca435a0e0f\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Poppins\";\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e6f6ce06-6ae7-46da-b4e1-48d073c51e1e\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Poppins\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0309f4f6-3d2d-4f48-bea6-2d0f6a0ead59\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Poppins\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"253fd304-90ae-4a05-8c3d-5dac8bb323c2\") format(\"woff2\");\n}\n\n/* African Safari Group — Colour System\n   \"A darker, richer system.\" One deep near-black ground, a single brass accent\n   used like brass fittings (the 60/30/10 rule), warm neutrals throughout.\n   Base palette tokens, then semantic aliases. Use the aliases in product work. */\n\n:root {\n  /* ---- Base palette (the seven brand colours) ---- */\n  --asg-ink:            #171411; /* Primary ground — heroes, headers, footers */\n  --asg-charcoal:       #2B2622; /* Dark UI elements, secondary dark ground */\n  --asg-soft-charcoal:  #4A443C; /* Body copy on light backgrounds */\n  --asg-brass:          #A8794B; /* Primary accent — CTAs, links, sparingly */\n  --asg-heritage-sand:  #C39F77; /* Legacy tone — tints & secondary accents only */\n  --asg-warm-ivory:     #F6F1EA; /* Light ground — editorial pages, email */\n  --asg-bone:           #B9AFA2; /* Borders & dividers on light ground */\n  --asg-white:          #FFFFFF;\n\n  /* ---- Derived tints & shades (for states, scrims, tints) ---- */\n  --asg-ink-900:        #0E0C0A; /* deepest — overlays, scrim bottoms */\n  --asg-ink-800:        #171411;\n  --asg-ink-700:        #211D19;\n  --asg-charcoal-600:   #2B2622;\n  --asg-charcoal-500:   #3A342E;\n  --asg-brass-600:      #8E6238; /* brass pressed / darker */\n  --asg-brass-500:      #A8794B; /* brass base */\n  --asg-brass-400:      #BB9165; /* brass hover (lighter) */\n  --asg-sand-tint:      #E8DCCB; /* heritage sand at low strength */\n  --asg-ivory-200:      #EFE7DB; /* ivory, one step down — card on ivory */\n  --asg-bone-300:       #D8CFC2; /* hairline on ivory */\n\n  /* Transparent brass for focus rings / subtle fills */\n  --asg-brass-a20:      rgba(168, 121, 75, 0.20);\n  --asg-brass-a40:      rgba(168, 121, 75, 0.40);\n  --asg-ivory-a08:      rgba(246, 241, 234, 0.08);\n  --asg-ivory-a14:      rgba(246, 241, 234, 0.14);\n  --asg-ink-a60:        rgba(14, 12, 10, 0.60);\n\n  /* =========================================================\n     SEMANTIC ALIASES — prefer these in product work\n     Default theme is DARK (ink ground), matching brand heroes.\n     ========================================================= */\n\n  /* Surfaces */\n  --surface-base:       var(--asg-ink);          /* page ground */\n  --surface-raised:     var(--asg-charcoal);     /* cards, panels on dark */\n  --surface-overlay:    var(--asg-ink-700);      /* menus, popovers */\n  --surface-inset:      var(--asg-ink-900);      /* wells, code, inputs */\n  --surface-ivory:      var(--asg-warm-ivory);   /* light editorial sections */\n  --surface-ivory-raised: var(--asg-white);      /* card on ivory */\n\n  /* Text (on dark ground) */\n  --text-primary:       var(--asg-warm-ivory);   /* headlines, key copy */\n  --text-body:          #D9D1C6;                 /* long-form body on dark */\n  --text-muted:         #9A9085;                 /* captions, meta */\n  --text-faint:         #6A6259;                 /* disabled, placeholder */\n  --text-on-brass:      var(--asg-ink);          /* text sitting on brass fill */\n\n  /* Text (on light/ivory ground) */\n  --text-primary-ink:   var(--asg-ink);\n  --text-body-ink:      var(--asg-soft-charcoal);\n  --text-muted-ink:     #7A7166;\n\n  /* Accent */\n  --accent:             var(--asg-brass);\n  --accent-hover:       var(--asg-brass-400);\n  --accent-active:      var(--asg-brass-600);\n  --accent-quiet:       var(--asg-heritage-sand); /* secondary accent / tints */\n  --link:               var(--asg-brass);\n  --link-on-light:      var(--asg-brass-600);\n\n  /* Borders & dividers */\n  --border-subtle:      var(--asg-ivory-a08);    /* hairlines on dark */\n  --border-default:     var(--asg-ivory-a14);    /* dividers, card edges on dark */\n  --border-strong:      #4A443C;                 /* inputs, emphasis on dark */\n  --border-on-light:    var(--asg-bone);         /* dividers on ivory */\n  --border-rule:        var(--asg-brass);        /* the brass rule-line moments */\n\n  /* Focus */\n  --focus-ring:         var(--asg-brass);\n  --focus-ring-shadow:  0 0 0 3px var(--asg-brass-a40);\n\n  /* Feedback (kept warm + restrained, never neon) */\n  --success:            #6E8A5A;\n  --success-bg:         #20231B;\n  --warning:            #C08A3E;\n  --warning-bg:         #2A2117;\n  --danger:             #B5524A;\n  --danger-bg:          #2A1815;\n  --info:               var(--asg-heritage-sand);\n  --info-bg:            #241F19;\n\n  /* Scrim — the mandatory dark gradient behind the mark / text over photos */\n  --scrim-bottom: linear-gradient(to top, rgba(14,12,10,0.92) 0%, rgba(14,12,10,0.55) 38%, rgba(14,12,10,0) 100%); /* @kind other */\n  --scrim-full: linear-gradient(to top, rgba(14,12,10,0.85) 0%, rgba(14,12,10,0.35) 50%, rgba(14,12,10,0.55) 100%); /* @kind other */\n}\n\n/* African Safari Group — Typography\n   Lora (serif) for display/headlines — one serif moment per screen.\n   Poppins (sans) for body, navigation, UI, and ALL numerals.\n   Type scale is editorial: large, confident headlines; generous body. */\n\n:root {\n  /* ---- Families ---- */\n  --font-serif:   \"Lora\", Georgia, \"Times New Roman\", serif;\n  --font-sans:    \"Poppins\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-display: var(--font-serif);  /* H1/H2, pull quotes, lodge names */\n  --font-body:    var(--font-sans);   /* body, UI, captions */\n  --font-numeric: var(--font-sans);   /* prices, dates, stats — always Poppins */\n\n  /* ---- Weights ---- */\n  --fw-regular: 400; /* @kind other */\n  --fw-medium: 500; /* @kind other */  /* numerals, buttons, labels */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold: 700; /* @kind other */\n\n  /* ---- Type scale (rem, 16px base) ---- */\n  --fs-display: clamp(2.75rem, 1.6rem + 4.6vw, 4.5rem); /* @kind other */  /* hero serif, 44–72px */\n  --fs-h1: clamp(2.25rem, 1.5rem + 3vw, 3.25rem); /* @kind other */   /* 36–52px */\n  --fs-h2: clamp(1.75rem, 1.25rem + 2vw, 2.5rem); /* @kind other */   /* 28–40px */\n  --fs-h3: 1.5rem; /* @kind other */     /* 24px */\n  --fs-h4: 1.25rem; /* @kind other */    /* 20px */\n  --fs-lead: 1.1875rem; /* @kind other */  /* 19px — intro / standfirst */\n  --fs-body: 1rem; /* @kind other */       /* 16px */\n  --fs-body-sm: 0.9375rem; /* @kind other */  /* 15px */\n  --fs-caption: 0.8125rem; /* @kind other */  /* 13px */\n  --fs-eyebrow: 0.75rem; /* @kind other */    /* 12px — tracked caps */\n  --fs-micro: 0.6875rem; /* @kind other */  /* 11px — never set Poppins all-caps below 9pt */\n\n  /* ---- Line heights ---- */\n  --lh-display: 1.04; /* @kind other */\n  --lh-heading: 1.12; /* @kind other */\n  --lh-snug: 1.3; /* @kind other */\n  --lh-body: 1.65; /* @kind other */   /* long-form comfort */\n  --lh-ui: 1.45; /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-display: -0.015em; /* @kind other */  /* tighten large serif */\n  --ls-heading: -0.01em; /* @kind other */\n  --ls-body: 0; /* @kind other */\n  --ls-eyebrow: 0.22em; /* @kind other */    /* tracked caps for eyebrows & labels */\n  --ls-button: 0.06em; /* @kind other */\n  --ls-wordmark: 0.34em; /* @kind other */    /* the wide-tracked wordmark setting */\n\n  /* ---- Measure (line length) — body never spans full width ---- */\n  --measure: 68ch; /* @kind other */      /* target 60–75 characters */\n  --measure-tight: 46ch; /* @kind other */\n}\n\n/* African Safari Group — Spacing\n   Restrained, editorial layouts breathe. 4px base unit, generous section rhythm. */\n\n:root {\n  --space-0:    0;\n  --space-1:    0.25rem;  /* 4px  */\n  --space-2:    0.5rem;   /* 8px  */\n  --space-3:    0.75rem;  /* 12px */\n  --space-4:    1rem;     /* 16px */\n  --space-5:    1.5rem;   /* 24px */\n  --space-6:    2rem;     /* 32px */\n  --space-7:    3rem;     /* 48px */\n  --space-8:    4rem;     /* 64px */\n  --space-9:    6rem;     /* 96px */\n  --space-10:   8rem;     /* 128px */\n\n  /* Semantic rhythm */\n  --gap-inline:     var(--space-2);  /* between inline siblings (icon+label) */\n  --gap-control:    var(--space-3);  /* inside controls */\n  --gap-card:       var(--space-5);  /* card padding */\n  --gap-stack:      var(--space-5);  /* between stacked blocks */\n  --gap-section:    var(--space-9);  /* between page sections — generous */\n\n  /* Layout containers */\n  --container-max:  1200px;  /* editorial max width */\n  --container-wide: 1440px;  /* full marketing width */\n  --container-text: 720px;   /* reading column */\n  --gutter:         clamp(1.25rem, 5vw, 4rem); /* @kind spacing */ /* page side margins — generous */\n}\n\n/* African Safari Group — Radius, Borders, Elevation, Motion\n   Restraint: corners are nearly square, borders are hairlines, shadows are\n   deep-but-soft (never a bright drop-shadow). Confidence is quiet. */\n\n:root {\n  /* ---- Corner radius — minimal, architectural ---- */\n  --radius-none:   0;\n  --radius-xs:     2px;   /* inputs, chips, default controls */\n  --radius-sm:     4px;   /* buttons, small cards */\n  --radius-md:     6px;   /* cards, panels */\n  --radius-lg:     10px;  /* large media cards, dialogs */\n  --radius-pill:   999px; /* avatars, status dots, the occasional pill tag */\n\n  /* ---- Border widths ---- */\n  --border-hairline: 1px; /* @kind other */\n  --border-rule-w: 2px; /* @kind other */  /* the brass rule-line under wordmarks/eyebrows */\n\n  /* ---- Elevation — soft, warm-black shadows on dark ground ---- */\n  --shadow-none:   none;\n  --shadow-sm:     0 1px 2px rgba(8, 6, 4, 0.40);\n  --shadow-md:     0 6px 18px rgba(8, 6, 4, 0.45);\n  --shadow-lg:     0 18px 48px rgba(8, 6, 4, 0.55);\n  --shadow-xl:     0 32px 80px rgba(8, 6, 4, 0.62);\n  /* On ivory ground, shadows are far lighter */\n  --shadow-ivory-sm: 0 1px 2px rgba(74, 68, 60, 0.10);\n  --shadow-ivory-md: 0 10px 30px rgba(74, 68, 60, 0.12);\n\n  /* ---- Motion — fades & gentle slides, no bounce ---- */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */  /* ease-out, calm */\n  --ease-entrance: cubic-bezier(0.16, 1, 0.30, 1); /* @kind other */     /* longer settle */\n  --ease-exit: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 240ms; /* @kind other */\n  --dur-slow: 420ms; /* @kind other */\n  --dur-reveal: 720ms; /* @kind other */  /* editorial image / headline reveals */\n\n  /* ---- Z-index scale ---- */\n  --z-base: 0; /* @kind other */\n  --z-raised: 10; /* @kind other */\n  --z-sticky: 100; /* @kind other */\n  --z-overlay: 1000; /* @kind other */\n  --z-modal: 1100; /* @kind other */\n  --z-toast: 1200; /* @kind other */\n}\n\n/* African Safari Group — Base & Utilities\n   Element defaults + a small set of brand utility classes. Dark ground by\n   default (brand heroes/headers/footers). Wrap light editorial areas in\n   .asg-on-ivory to flip text colours. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  font-weight: var(--fw-regular);\n  line-height: var(--lh-body);\n  letter-spacing: var(--ls-body);\n  color: var(--text-body);\n  background: var(--surface-base);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---- Headings — Lora display, one serif moment per screen ---- */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-primary);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-heading);\n  margin: 0 0 var(--space-4);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); line-height: var(--lh-display); letter-spacing: var(--ls-display); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); font-family: var(--font-body); font-weight: var(--fw-semibold); }\n\np { margin: 0 0 var(--space-4); max-width: var(--measure); text-wrap: pretty; }\n\na { color: var(--link); text-decoration: none; transition: color var(--dur-fast) var(--ease-standard); }\na:hover { color: var(--accent-hover); }\n\nstrong { font-weight: var(--fw-semibold); color: var(--text-primary); }\nsmall { font-size: var(--fs-caption); }\n\n/* Numerals are always Poppins, even inside serif */\n.asg-num, .asg-price, time, [data-numeric] {\n  font-family: var(--font-numeric);\n  font-weight: var(--fw-medium);\n  font-feature-settings: \"tnum\" 1;\n}\n\n/* ---- Display & editorial helpers ---- */\n.asg-display {\n  font-family: var(--font-display);\n  font-size: var(--fs-display);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-display);\n  color: var(--text-primary);\n  font-weight: var(--fw-medium);\n  margin: 0;\n}\n\n.asg-lead {\n  font-size: var(--fs-lead);\n  line-height: var(--lh-snug);\n  color: var(--text-body);\n  max-width: var(--measure);\n}\n\n/* Eyebrow — tracked caps, the recurring label moment */\n.asg-eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent);\n  display: inline-block;\n}\n\n/* Brass rule line — used under eyebrows / wordmarks, a key brand moment */\n.asg-rule {\n  width: 56px;\n  height: var(--border-rule-w);\n  background: var(--border-rule);\n  border: 0;\n  margin: var(--space-4) 0;\n}\n.asg-rule--center { margin-inline: auto; }\n\n/* ---- Layout ---- */\n.asg-container { max-width: var(--container-max); margin-inline: auto; padding-inline: var(--gutter); }\n.asg-container--wide { max-width: var(--container-wide); }\n.asg-container--text { max-width: var(--container-text); }\n.asg-section { padding-block: var(--gap-section); }\n\n/* ---- Theme scopes ---- */\n.asg-on-ivory {\n  background: var(--surface-ivory);\n  color: var(--text-body-ink);\n}\n.asg-on-ivory h1, .asg-on-ivory h2, .asg-on-ivory h3, .asg-on-ivory h4 { color: var(--text-primary-ink); }\n.asg-on-ivory a { color: var(--link-on-light); }\n.asg-on-ivory strong { color: var(--text-primary-ink); }\n\n/* ---- Selection ---- */\n::selection { background: var(--asg-brass-a40); color: var(--asg-warm-ivory); }\n\n/* ---- Reduced motion ---- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }\n}\n\n/* African Safari Group — Light Edition theme\n   Same seven brand colours, inverted application: Warm Ivory is the dominant\n   ground (60%), Ink/Charcoal carries text & selective dark sections (30%),\n   Safari Brass stays the single 10% signal.\n\n   Default (no attribute) = the dark system. Add data-theme=\"light\" to any root\n   (html, body, a section, a kit) and every component re-skins to the light\n   edition — it remaps the semantic aliases plus the few base tokens the\n   components reference directly. */\n\n[data-theme=\"light\"] {\n  /* Surfaces — ivory ground, white raised */\n  --surface-base:         var(--asg-warm-ivory);\n  --surface-raised:       var(--asg-white);\n  --surface-overlay:      var(--asg-white);\n  --surface-inset:        var(--asg-ivory-200);\n  --surface-ivory:        var(--asg-warm-ivory);\n  --surface-ivory-raised: var(--asg-white);\n\n  /* Text — ink on ivory */\n  --text-primary:   var(--asg-ink);\n  --text-body:      var(--asg-soft-charcoal);\n  --text-muted:     #7A7166;\n  --text-faint:     #A89E90;\n  --text-on-brass:  var(--asg-ink);\n\n  /* Accent — brass darkens on hover for contrast against light */\n  --accent:         var(--asg-brass);\n  --accent-hover:   var(--asg-brass-600);\n  --accent-active:  #6F4C2C;\n  --accent-quiet:   var(--asg-brass-600);\n  --link:           var(--asg-brass-600);\n\n  /* Borders & dividers — ink-based hairlines, bone for strong */\n  --border-subtle:  rgba(23, 20, 17, 0.07);\n  --border-default: rgba(23, 20, 17, 0.12);\n  --border-strong:  var(--asg-bone);\n  --border-rule:    var(--asg-brass);\n\n  /* Focus ring stays brass */\n  --focus-ring:        var(--asg-brass);\n  --focus-ring-shadow: 0 0 0 3px var(--asg-brass-a40);\n\n  /* Base tokens the components reference directly — repurposed for light */\n  --asg-ivory-a08:    rgba(23, 20, 17, 0.05);   /* faint ground wash (ghost hover, neutral badge) */\n  --asg-ivory-a14:    rgba(23, 20, 17, 0.09);\n  --asg-charcoal-500: #D8CFC2;                   /* input hover border, switch track, avatar bg */\n  --asg-charcoal:     var(--asg-white);          /* native <option> background */\n  --asg-ink-900:      #2B2622;                   /* tooltip bubble stays dark — legible on light */\n\n  /* Feedback — light tints instead of dark wells */\n  --success:    #5B7A48;  --success-bg: #EBF0E3;\n  --warning:    #9A6A25;  --warning-bg: #F6EBD7;\n  --danger:     #A8443B;  --danger-bg:  #F7E3DF;\n  --info:       var(--asg-brass-600);  --info-bg: #F1E8DA;\n\n  /* Modal scrim — keep a dark veil behind dialogs (legible focus on light) */\n  --asg-ink-a60: rgba(23, 20, 17, 0.45);\n\n  /* Soft, light shadows on ivory */\n  --shadow-sm: 0 1px 2px rgba(74, 68, 60, 0.10);\n  --shadow-md: 0 6px 18px rgba(74, 68, 60, 0.12);\n  --shadow-lg: 0 16px 40px rgba(74, 68, 60, 0.16);\n  --shadow-xl: 0 30px 70px rgba(74, 68, 60, 0.20);\n\n  color: var(--text-body);\n  background: var(--surface-base);\n}\n\n/* On a light ground the page-level selection should read ink, not ivory */\n[data-theme=\"light\"] ::selection { background: var(--asg-brass-a40); color: var(--asg-ink); }\n\n\n<\u002Fstyle>\n\n<style>\n  :root{\n    --ink:#171411; --charcoal:#2B2622; --soft:#4A443C;\n    --brass:#A8794B; --brass-600:#8E6238; --brass-400:#BB9165;\n    --sand:#C39F77; --sand-tint:#E8DCCB;\n    --ivory:#F6F1EA; --ivory-200:#EFE7DB; --white:#FDFBF8;\n    --bone:#B9AFA2; --bone-300:#D8CFC2;\n    --ink-body:#4A443C; --ink-muted:#7A7166;\n    --ok:#6E8A5A; --warn:#C08A3E; --bad:#B5524A;\n    --serif:'Lora',Georgia,serif; --sans:'Poppins','Helvetica Neue',Arial,sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{background:#26221e;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\n\n  /* ---- Paged A4 ---- */\n  .book{display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 16px 60px;}\n  .sheet{width:210mm;height:297mm;background:var(--ivory);position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);color:var(--ink);}\n  .pad{padding:20mm 20mm 18mm;}\n  .dark{background:var(--ink);color:var(--ivory);}\n  .charc{background:var(--charcoal);color:var(--ivory);}\n\n  /* ---- Shared type ---- */\n  .ey{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);margin:0;}\n  .dark .ey,.charc .ey{color:var(--brass-400);}\n  .rule{width:64px;height:2px;background:var(--brass);border:0;margin:11px 0 0;}\n  .rule.wide{width:100%;}\n  h1,h2,h3,h4{font-family:var(--serif);font-weight:500;color:var(--ink);margin:0;line-height:1.1;text-wrap:balance;}\n  .dark h1,.dark h2,.dark h3,.charc h1,.charc h2{color:var(--ivory);}\n  .h-page{font-size:33px;line-height:1.05;margin:15px 0 0;letter-spacing:.005em;}\n  .h-sub{font-size:20px;margin:0;}\n  p{margin:0;line-height:1.62;font-size:12.5px;color:var(--ink-body);max-width:62ch;}\n  .lead{font-size:15.5px;line-height:1.6;color:var(--soft);font-weight:300;}\n  .muted{color:var(--ink-muted);}\n  .sans-cap{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);}\n  .serif-it{font-family:var(--serif);font-style:italic;}\n  .num{font-family:var(--sans);font-weight:500;font-feature-settings:\"tnum\" 1;}\n  strong,b{font-weight:600;color:var(--ink);}\n  .dark strong,.dark b,.charc strong,.charc b{color:var(--ivory);}\n  p strong{color:var(--ink);}\n\n  /* running header / footer on content pages */\n  .rhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bone-300);padding-bottom:8px;margin-bottom:22px;}\n  .rhead .sans-cap{color:var(--ink-muted);}\n  .foot{position:absolute;left:20mm;right:20mm;bottom:12mm;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bone-300);padding-top:7px;}\n  .foot span{font-family:var(--sans);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);}\n\n  /* ---- Cover ---- */\n  .cover{display:flex;flex-direction:column;justify-content:space-between;padding:26mm 22mm;background:radial-gradient(120% 90% at 50% 12%, #211d18 0%, #171411 62%);}\n  .cover-top{display:flex;justify-content:space-between;align-items:flex-start;}\n  .cover-top .sans-cap{color:var(--bone);letter-spacing:.24em;}\n  .cover-mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;}\n  .cover-mid img{width:150px;height:auto;margin-bottom:26px;}\n  .cover-mid .eyc{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--brass-400);margin:0 0 18px;}\n  .cover-mid h1{font-size:62px;line-height:.98;color:var(--ivory);letter-spacing:.01em;}\n  .cover-mid .yr{font-family:var(--sans);font-weight:200;font-size:44px;color:var(--brass);letter-spacing:.2em;margin-top:6px;}\n  .cover-rule{width:80px;height:2px;background:var(--brass);margin:26px auto 0;}\n  .cover-tag{font-family:var(--serif);font-style:italic;font-size:16px;color:#C9C0B4;margin:22px auto 0;max-width:34ch;line-height:1.5;}\n  .cover-bot{display:flex;justify-content:space-between;align-items:flex-end;}\n  .cover-bot span{font-family:var(--sans);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone);}\n\n  /* ---- Section divider ---- */\n  .divider{display:flex;flex-direction:column;justify-content:center;padding:0 26mm;}\n  .divider .dnum{font-family:var(--serif);font-size:150px;line-height:.8;color:var(--brass);opacity:.9;}\n  .divider h1{font-size:52px;margin:6px 0 0;color:var(--ivory);}\n  .divider .dlist{margin-top:34px;display:flex;flex-direction:column;gap:11px;max-width:70%;}\n  .divider .dlist .di{display:flex;gap:16px;align-items:baseline;font-family:var(--sans);font-size:12.5px;color:#C9C0B4;border-top:1px solid rgba(246,241,234,.12);padding-top:11px;}\n  .divider .dlist .di b{color:var(--brass-400);font-weight:600;min-width:26px;}\n  .divider .dtag{position:absolute;bottom:22mm;left:26mm;right:26mm;display:flex;justify-content:space-between;font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone);border-top:1px solid rgba(246,241,234,.12);padding-top:12px;}\n\n  /* ---- Contents ---- */\n  .toc2{display:grid;grid-template-columns:1fr 1fr;gap:26px 46px;margin-top:28px;align-content:start;}\n  .tg .gh{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-600);padding-bottom:8px;border-bottom:1px solid var(--brass);margin-bottom:6px;}\n  .tg .gi{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:6px 0;}\n  .tg .gi .t{font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.3;}\n  .tg .gi .pg{font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--ink-muted);flex:none;}\n\n  /* ---- Layout helpers ---- */\n  .col2{display:grid;grid-template-columns:1fr 1fr;gap:26px;}\n  .col2u{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;}\n  .stack{display:flex;flex-direction:column;gap:14px;}\n  .body-copy{margin-top:16px;display:flex;flex-direction:column;gap:10px;}\n\n  /* ---- Logo specimens ---- */\n  .logo-cell{background:var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;padding:26px;min-height:130px;}\n  .logo-cell.light{background:var(--white);border:1px solid var(--bone-300);}\n  .logo-cell img{max-height:70px;width:auto;}\n  .logo-cell.tall img{max-height:96px;}\n  .spec-cap{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-top:8px;}\n\n  /* clea ">Brand Guidelines 2026<\u002Fspan><span class=\"sans-cap\">African Safari Group<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Contents<\u002Fp>\n    <h2 class=\"h-page\">What's inside<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"toc2\">\n      <div class=\"tg\">\n        <div class=\"gh\">Foundations<\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Introduction &amp; how to use this guide<\u002Fspan><span class=\"pg\">03<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg\">\n        <div class=\"gh\">01 · The Logo<\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">The crest &amp; primary lockups<\u002Fspan><span class=\"pg\">05<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Clear space &amp; minimum size<\u002Fspan><span class=\"pg\">06<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Logo misuse — what never to do<\u002Fspan><span class=\"pg\">07<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Approved grounds &amp; sub-brands<\u002Fspan><span class=\"pg\">08<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg\">\n        <div class=\"gh\">02 · Colour<\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">The primary palette<\u002Fspan><span class=\"pg\">10<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">The 60 / 30 / 10 rule<\u002Fspan><span class=\"pg\">11<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Neutrals &amp; feedback colours<\u002Fspan><span class=\"pg\">12<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg\">\n        <div class=\"gh\">03 · Typography<\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Lora &amp; Poppins — our two typefaces<\u002Fspan><span class=\"pg\">14<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Type scale &amp; usage rules<\u002Fspan><span class=\"pg\">15<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg\">\n        <div class=\"gh\">04 · Voice &amp; Imagery<\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">How we write — voice &amp; tone<\u002Fspan><span class=\"pg\">17<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Photography direction<\u002Fspan><span class=\"pg\">18<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg\">\n        <div class=\"gh\">05 · Applications<\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Stationery — letterhead &amp; slip<\u002Fspan><span class=\"pg\">20<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Business cards<\u002Fspan><span class=\"pg\">21<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Folders, files &amp; documents<\u002Fspan><span class=\"pg\">22<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Websites<\u002Fspan><span class=\"pg\">23<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Newsletters &amp; email<\u002Fspan><span class=\"pg\">24<\u002Fspan><\u002Fdiv>\n        <div class=\"gi\"><span class=\"t\">Quick do &amp; don't reference<\u002Fspan><span class=\"pg\">25<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>02<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 03 · INTRODUCTION ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Introduction\">\n    <div class=\"rhead\"><span class=\"sans-cap\">Brand Guidelines 2026<\u002Fspan><span class=\"sans-cap\">Introduction<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Introduction<\u002Fp>\n    <h2 class=\"h-page\">A brand built on quiet confidence<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"col2u\" style=\"margin-top:22px;\">\n      <div class=\"stack\">\n        <p class=\"lead\">African Safari Group is a Premier Inbound Travel Agent, designing and fulfilling five-star safari journeys across Southern and East Africa — sold through consultation, never self-service.<\u002Fp>\n        <p>Our brand is <strong>dark, restrained, editorial luxury<\u002Fstrong> — closer to Aman or Singita than a typical travel agency. Confidence is shown through precision and space, never volume. This guide exists so that every touchpoint — a letter, a business card, a website, a newsletter — feels unmistakably like us.<\u002Fp>\n        <p>Please treat it as the single source of truth. When in doubt, choose restraint: fewer colours, more space, one clear message.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stack\">\n        <div class=\"note\"><p class=\"serif-it\" style=\"font-size:14px;\">\"Specific over superlative. Never salesy, never shouting.\"<\u002Fp><p style=\"margin-top:6px;\">Our voice in one line.<\u002Fp><\u002Fdiv>\n        <div>\n          <p class=\"sans-cap\" style=\"margin-bottom:8px;\">How to use this guide<\u002Fp>\n          <p style=\"font-size:11.5px;\">Sections 01–04 define the fixed foundations — logo, colour, type, voice. Section 05 shows how they come together across the materials you'll produce most: stationery, cards, folders, websites and newsletters. The foundations never change; the applications show you how to apply them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:26px;\">\n      <p class=\"sans-cap\" style=\"margin-bottom:10px;\">The four principles<\u002Fp>\n      <div class=\"col2\" style=\"grid-template-columns:repeat(4,1fr);gap:14px;\">\n        <div class=\"note\" style=\"border-color:var(--brass);background:transparent;border-left-width:2px;\"><p class=\"serif-it\" style=\"font-size:15px;color:var(--ink);\">Restraint<\u002Fp><p style=\"font-size:10px;margin-top:4px;\">Space and silence do the work.<\u002Fp><\u002Fdiv>\n        <div class=\"note\" style=\"border-color:var(--brass);background:transparent;border-left-width:2px;\"><p class=\"serif-it\" style=\"font-size:15px;color:var(--ink);\">Precision<\u002Fp><p style=\"font-size:10px;margin-top:4px;\">Specific detail over adjectives.<\u002Fp><\u002Fdiv>\n        <div class=\"note\" style=\"border-color:var(--brass);background:transparent;border-left-width:2px;\"><p class=\"serif-it\" style=\"font-size:15px;color:var(--ink);\">Warmth<\u002Fp><p style=\"font-size:10px;margin-top:4px;\">Authoritative, never cold.<\u002Fp><\u002Fdiv>\n        <div class=\"note\" style=\"border-color:var(--brass);background:transparent;border-left-width:2px;\"><p class=\"serif-it\" style=\"font-size:15px;color:var(--ink);\">Consistency<\u002Fp><p style=\"font-size:10px;margin-top:4px;\">One brass, one crest, everywhere.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>03<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 · DIVIDER: LOGO ============ -->\n  <section class=\"sheet dark divider\" data-screen-label=\"Divider — Logo\">\n    <div class=\"dnum\">01<\u002Fdiv>\n    <h1>The Logo<\u002Fh1>\n    <div class=\"cover-rule\" style=\"margin:22px 0 0;\"><\u002Fdiv>\n    <div class=\"dlist\">\n      <div class=\"di\"><b>05<\u002Fb><span>The crest &amp; primary lockups<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>06<\u002Fb><span>Clear space &amp; minimum size<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>07<\u002Fb><span>Misuse — what never to do<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>08<\u002Fb><span>Approved grounds &amp; sub-brand architecture<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dtag\"><span>African Safari Group<\u002Fspan><span>Brand Guidelines 2026<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 · LOGO LOCKUPS ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Logo — lockups\">\n    <div class=\"rhead\"><span class=\"sans-cap\">01 · The Logo<\u002Fspan><span class=\"sans-cap\">Lockups<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">The Mark<\u002Fp>\n    <h2 class=\"h-page\">The crest &amp; primary lockups<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:16px;\">Our mark pairs a fixed lion crest with a tracked serif wordmark. The crest is <strong>never redrawn<\u002Fstrong>. Use the lockup that fits the space — and always give it room to breathe.<\u002Fp>\n    <div class=\"col2\" style=\"margin-top:20px;\">\n      <div><div class=\"logo-cell tall\"><img src=\"75518738-a80e-456d-836f-07d8ab5c78a5\" alt=\"Stacked lockup\"><\u002Fdiv><p class=\"spec-cap\">Stacked — the master lockup<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell\"><img src=\"04963c5a-9ea3-4007-9115-6d4e6f9af260\" alt=\"Horizontal lockup\"><\u002Fdiv><p class=\"spec-cap\">Horizontal — preferred for nav &amp; headers<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"col2\" style=\"margin-top:16px;\">\n      <div><div class=\"logo-cell\" style=\"min-height:96px;\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" alt=\"Crest\" style=\"max-height:64px;\"><\u002Fdiv><p class=\"spec-cap\">Crest only — favicons, stamps, tight spaces<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell light\" style=\"min-height:96px;\"><img src=\"98920c08-a6d5-47dc-9d3a-48825c881d7f\" alt=\"Ink stacked\" style=\"max-height:64px;\"><\u002Fdiv><p class=\"spec-cap\">Ink version — for light grounds<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\" style=\"margin-top:20px;\"><p><strong>One mark, three lockups.<\u002Fstrong> Choose by context, not preference. The stacked lockup leads on covers and formal documents; the horizontal lockup runs in website and letterhead headers; the crest alone appears only where the full name already reads nearby.<\u002Fp><\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>05<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 06 · CLEAR SPACE ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Logo — clear space\">\n    <div class=\"rhead\"><span class=\"sans-cap\">01 · The Logo<\u002Fspan><span class=\"sans-cap\">Clear space &amp; size<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Protection<\u002Fp>\n    <h2 class=\"h-page\">Clear space &amp; minimum size<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"col2u\" style=\"margin-top:20px;\">\n      <div>\n        <div class=\"clear\">\n          <div class=\"box\"><img src=\"de19218b-3989-44cc-b66e-652f72b21a0e\" alt=\"\" style=\"filter:none;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"spec-cap\" style=\"text-align:center;\">Minimum clear space = the height of the crest, on all sides<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stack\">\n        <p>Always surround the logo with clear space at least equal to the <strong>height of the crest<\u002Fstrong>. Keep type, images, edges and other logos out of this zone.<\u002Fp>\n        <div>\n          <p class=\"sans-cap\" style=\"margin-bottom:8px;\">Minimum sizes<\u002Fp>\n          <div class=\"scale-row\"><span style=\"font-family:var(--serif);font-size:15px;\">Stacked lockup<\u002Fspan><span class=\"lbl\">32 px / 12 mm<\u002Fspan><\u002Fdiv>\n          <div class=\"scale-row\"><span style=\"font-family:var(--serif);font-size:15px;\">Horizontal lockup<\u002Fspan><span class=\"lbl\">28 px / 24 mm wide<\u002Fspan><\u002Fdiv>\n          <div class=\"scale-row\" style=\"border-bottom:0;\"><span style=\"font-family:var(--serif);font-size:15px;\">Crest only<\u002Fspan><span class=\"lbl\">20 px / 8 mm<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:11px;\">Below these sizes the crest detail breaks down. When a mark must go smaller than the minimum, use the crest alone rather than the full lockup.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>06<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 07 · MISUSE ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Logo — misuse\">\n    <div class=\"rhead\"><span class=\"sans-cap\">01 · The Logo<\u002Fspan><span class=\"sans-cap\">Misuse<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">What never to do<\u002Fp>\n    <h2 class=\"h-page\">Logo misuse<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:16px;\">The mark is fixed. These are the most common mistakes — each one weakens the brand. If a use isn't shown as approved elsewhere in this guide, don't do it.<\u002Fp>\n    <div class=\"col2\" style=\"grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;\">\n      <div><div class=\"logo-cell\" style=\"min-height:100px;position:relative;\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" style=\"max-height:56px;transform:scaleX(1.6);\"><span style=\"position:absolute;bottom:8px;right:10px;color:var(--bad);font-size:20px;\">✕<\u002Fspan><\u002Fdiv><p class=\"spec-cap\">Don't stretch or distort<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell\" style=\"min-height:100px;background:#3a6b2f;position:relative;\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" style=\"max-height:56px;\"><span style=\"position:absolute;bottom:8px;right:10px;color:#fff;font-size:20px;\">✕<\u002Fspan><\u002Fdiv><p class=\"spec-cap\">Don't place on off-brand colours<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell\" style=\"min-height:100px;position:relative;\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" style=\"max-height:56px;filter:drop-shadow(3px 4px 3px rgba(255,255,255,.6));\"><span style=\"position:absolute;bottom:8px;right:10px;color:var(--bad);font-size:20px;\">✕<\u002Fspan><\u002Fdiv><p class=\"spec-cap\">Don't add shadows or effects<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell light\" style=\"min-height:100px;position:relative;\"><img src=\"91fe02c5-283e-4eb6-9171-d91fd48f10ee\" style=\"max-height:56px;\"><span style=\"position:absolute;bottom:8px;right:10px;color:var(--bad);font-size:20px;\">✕<\u002Fspan><\u002Fdiv><p class=\"spec-cap\">Don't use brass crest on light<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell\" style=\"min-height:100px;position:relative;\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" style=\"max-height:56px;transform:rotate(-12deg);\"><span style=\"position:absolute;bottom:8px;right:10px;color:var(--bad);font-size:20px;\">✕<\u002Fspan><\u002Fdiv><p class=\"spec-cap\">Don't rotate or tilt<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell\" style=\"min-height:100px;position:relative;\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" style=\"max-height:56px;opacity:.35;\"><span style=\"position:absolute;bottom:8px;right:10px;color:var(--bad);font-size:20px;\">✕<\u002Fspan><\u002Fdiv><p class=\"spec-cap\">Don't lower opacity as a watermark<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\" style=\"margin-top:20px;border-color:var(--bad);\"><p><strong>Also never:<\u002Fstrong> recolour the crest outside Ink, Ivory, Brass, Heritage Sand or White · redraw or replace the lion · crop the crest · box the logo in a coloured shape · set the wordmark in a different typeface.<\u002Fp><\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>07<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 08 · GROUNDS + SUBBRANDS ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Logo — grounds &amp; sub-brands\">\n    <div class=\"rhead\"><span class=\"sans-cap\">01 · The Logo<\u002Fspan><span class=\"sans-cap\">Grounds &amp; sub-brands<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Approved use<\u002Fp>\n    <h2 class=\"h-page\">Grounds &amp; sub-brands<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:14px;\">The crest sits only on approved grounds. Match the crest colour to the background for contrast and warmth.<\u002Fp>\n    <div class=\"col2\" style=\"grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;\">\n      <div><div class=\"logo-cell\" style=\"min-height:88px;background:var(--ink);\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" style=\"max-height:48px;\"><\u002Fdiv><p class=\"spec-cap\">White on Ink<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell light\" style=\"min-height:88px;\"><img src=\"de19218b-3989-44cc-b66e-652f72b21a0e\" style=\"max-height:48px;\"><\u002Fdiv><p class=\"spec-cap\">Ink on Ivory<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell\" style=\"min-height:88px;background:var(--brass);\"><img src=\"280c8ddf-9f13-4ee2-bc0a-852b96f9a39a\" style=\"max-height:48px;\"><\u002Fdiv><p class=\"spec-cap\">White on Brass<\u002Fp><\u002Fdiv>\n      <div><div class=\"logo-cell\" style=\"min-height:88px;background:var(--sand);\"><img src=\"de19218b-3989-44cc-b66e-652f72b21a0e\" style=\"max-height:48px;\"><\u002Fdiv><p class=\"spec-cap\">Ink on Heritage Sand<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"ey\" style=\"margin-top:24px;\">Sub-brand architecture<\u002Fp>\n    <h3 class=\"h-sub\" style=\"margin-top:8px;\">One crest, many domains<\u002Fh3>\n    <p style=\"margin-top:8px;\">Sub-brands share the same crest and serif setting — <strong>only the wordmark changes.<\u002Fstrong> Every sub-brand carries a \"Part of African Safari Group\" endorsement line.<\u002Fp>\n    <div class=\"col2\" style=\"margin-top:14px;gap:12px;\">\n      <div class=\"logo-cell light\" style=\"min-height:70px;justify-content:flex-start;gap:14px;\"><img src=\"de19218b-3989-44cc-b66e-652f72b21a0e\" style=\"max-height:40px;\"><div><div style=\"font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:var(--ink);\">SABI SAND<\u002Fdiv><div style=\"font-family:var(--sans);font-size:8px;letter-spacing:.28em;color:var(--ink-muted);\">GAME RESERVE<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"logo-cell light\" style=\"min-height:70px;justify-content:flex-start;gap:14px;\"><img src=\"de19218b-3989-44cc-b66e-652f72b21a0e\" style=\"max-height:40px;\"><div><div style=\"font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:var(--ink);\">ASG DIRECT<\u002Fdiv><div style=\"font-family:var(--sans);font-size:8px;letter-spacing:.28em;color:var(--ink-muted);\">BOOKINGS<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>08<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 09 · DIVIDER: COLOUR ============ -->\n  <section class=\"sheet dark divider\" data-screen-label=\"Divider — Colour\">\n    <div class=\"dnum\">02<\u002Fdiv>\n    <h1>Colour<\u002Fh1>\n    <div class=\"cover-rule\" style=\"margin:22px 0 0;\"><\u002Fdiv>\n    <div class=\"dlist\">\n      <div class=\"di\"><b>10<\u002Fb><span>The primary palette<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>11<\u002Fb><span>The 60 / 30 / 10 rule<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>12<\u002Fb><span>Neutrals &amp; feedback colours<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dtag\"><span>African Safari Group<\u002Fspan><span>Brand Guidelines 2026<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 10 · PALETTE ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Colour — palette\">\n    <div class=\"rhead\"><span class=\"sans-cap\">02 · Colour<\u002Fspan><span class=\"sans-cap\">Primary palette<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Palette<\u002Fp>\n    <h2 class=\"h-page\">The primary palette<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:14px;\">One deep near-black ground, a single brass accent, warm neutrals for breathing room. That's the whole system — hold to it.<\u002Fp>\n    <div class=\"sw-grid\" style=\"margin-top:16px;\">\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#171411;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">ASG Ink<\u002Fdiv><div class=\"hex\">#171411<\u002Fdiv><div class=\"ro\">Primary ground — heroes, headers, footers<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#A8794B;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Safari Brass<\u002Fdiv><div class=\"hex\">#A8794B<\u002Fdiv><div class=\"ro\">The single accent — CTAs, links, signal only<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#2B2622;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Charcoal<\u002Fdiv><div class=\"hex\">#2B2622<\u002Fdiv><div class=\"ro\">Secondary dark surface — cards, panels<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#F6F1EA;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Warm Ivory<\u002Fdiv><div class=\"hex\">#F6F1EA<\u002Fdiv><div class=\"ro\">Light editorial ground &amp; breathing room<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#C39F77;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Heritage Sand<\u002Fdiv><div class=\"hex\">#C39F77<\u002Fdiv><div class=\"ro\">Legacy tone — tints &amp; secondary accents only<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#4A443C;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Soft Charcoal<\u002Fdiv><div class=\"hex\">#4A443C<\u002Fdiv><div class=\"ro\">Body copy on light backgrounds<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\" style=\"margin-top:18px;border-color:var(--bad);\"><p><strong>Brass is a fitting, not a floor.<\u002Fstrong> Never let brass become a dominant background — as a large ground it reads as cheap gold. Used sparingly, it signals luxury.<\u002Fp><\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>10<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 11 · 60/30/10 ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Colour — 60/30/10\">\n    <div class=\"rhead\"><span class=\"sans-cap\">02 · Colour<\u002Fspan><span class=\"sans-cap\">The 60 / 30 / 10 rule<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Proportion<\u002Fp>\n    <h2 class=\"h-page\">The 60 / 30 / 10 rule<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:14px;\">Every layout follows one proportion. Use brass like brass fittings in a lodge — signal, never ground.<\u002Fp>\n    <div class=\"ratio-bar\" style=\"margin-top:18px;\">\n      <div class=\"seg\" style=\"flex:60;background:var(--ink);\"><span style=\"color:var(--ivory);\">60%<\u002Fspan><\u002Fdiv>\n      <div class=\"seg\" style=\"flex:30;background:var(--ivory);\"><span style=\"color:var(--ink);\">30%<\u002Fspan><\u002Fdiv>\n      <div class=\"seg\" style=\"flex:10;background:var(--brass);\"><span style=\"color:var(--ink);\">10%<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ratio-leg\">\n      <div class=\"lg\" style=\"border-color:var(--ink);\"><div class=\"pc\">60%<\u002Fdiv><div class=\"lb\"><strong>Ink &amp; Charcoal<\u002Fstrong> — the dominant dark ground carrying most of the surface.<\u002Fdiv><\u002Fdiv>\n      <div class=\"lg\" style=\"border-color:var(--bone);\"><div class=\"pc\">30%<\u002Fdiv><div class=\"lb\"><strong>Ivory &amp; White<\u002Fstrong> — breathing room, light editorial areas, negative space.<\u002Fdiv><\u002Fdiv>\n      <div class=\"lg\" style=\"border-color:var(--brass);\"><div class=\"pc\" style=\"color:var(--brass-600);\">10%<\u002Fdiv><div class=\"lb\"><strong>Brass<\u002Fstrong> — one primary CTA, key numerals, active states, the rule-line.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dd\" style=\"margin-top:24px;\">\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Do<\u002Fb><\u002Fdiv>\n        <ul><li>Let ink and ivory carry the layout<\u002Fli><li>Reserve brass for a single point of emphasis per view<\u002Fli><li>Use generous negative space as a design element<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Don't<\u002Fb><\u002Fdiv>\n        <ul><li>Fill backgrounds or large blocks with brass<\u002Fli><li>Use multiple accent colours competing for attention<\u002Fli><li>Crowd the layout — density reads as cheap<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>11<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 12 · NEUTRALS + FEEDBACK ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Colour — neutrals &amp; feedback\">\n    <div class=\"rhead\"><span class=\"sans-cap\">02 · Colour<\u002Fspan><span class=\"sans-cap\">Neutrals &amp; feedback<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Support<\u002Fp>\n    <h2 class=\"h-page\">Neutrals &amp; feedback<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p class=\"ey\" style=\"margin-top:20px;color:var(--ink-muted);\">Warm neutrals — the 30%<\u002Fp>\n    <div class=\"sw-grid\" style=\"grid-template-columns:repeat(4,1fr);margin-top:8px;\">\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#FDFBF8;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">White<\u002Fdiv><div class=\"hex\">#FDFBF8<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#EFE7DB;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Ivory 200<\u002Fdiv><div class=\"hex\">#EFE7DB<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#E8DCCB;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Sand Tint<\u002Fdiv><div class=\"hex\">#E8DCCB<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#B9AFA2;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Bone<\u002Fdiv><div class=\"hex\">#B9AFA2<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-top:12px;font-size:11px;\">Bone and Ivory 200 are for hairlines, dividers and low-contrast panels on light grounds. Never use them for body text.<\u002Fp>\n    <p class=\"ey\" style=\"margin-top:24px;color:var(--ink-muted);\">Feedback colours — warm &amp; muted, never neon<\u002Fp>\n    <div class=\"sw-grid\" style=\"grid-template-columns:repeat(4,1fr);margin-top:8px;\">\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#6E8A5A;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Success<\u002Fdiv><div class=\"hex\">#6E8A5A<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#C08A3E;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Warning<\u002Fdiv><div class=\"hex\">#C08A3E<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#B5524A;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Danger<\u002Fdiv><div class=\"hex\">#B5524A<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:#C39F77;height:56px;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Info<\u002Fdiv><div class=\"hex\">Sand<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\" style=\"margin-top:20px;\"><p>Feedback colours appear only in interfaces — form validation, alerts, status. They're deliberately desaturated to sit inside the warm palette. <strong>Never use bright or neon status colours.<\u002Fstrong><\u002Fp><\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>12<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 13 · DIVIDER: TYPE ============ -->\n  <section class=\"sheet dark divider\" data-screen-label=\"Divider — Typography\">\n    <div class=\"dnum\">03<\u002Fdiv>\n    <h1>Typography<\u002Fh1>\n    <div class=\"cover-rule\" style=\"margin:22px 0 0;\"><\u002Fdiv>\n    <div class=\"dlist\">\n      <div class=\"di\"><b>14<\u002Fb><span>Lora &amp; Poppins — our two typefaces<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>15<\u002Fb><span>Type scale &amp; usage rules<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dtag\"><span>African Safari Group<\u002Fspan><span>Brand Guidelines 2026<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 14 · TYPEFACES ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Type — typefaces\">\n    <div class=\"rhead\"><span class=\"sans-cap\">03 · Typography<\u002Fspan><span class=\"sans-cap\">Typefaces<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Two typefaces<\u002Fp>\n    <h2 class=\"h-page\">Lora &amp; Poppins<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"stack\" style=\"margin-top:20px;\">\n      <div class=\"type-spec\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;\"><span class=\"ey\" style=\"color:var(--brass-600);\">Serif — display &amp; headlines<\u002Fspan><span class=\"sans-cap\">Lora<\u002Fspan><\u002Fdiv>\n        <div class=\"big\" style=\"margin-top:10px;\">Where lions still rule<\u002Fdiv>\n        <div class=\"row\"><b>Regular 400<\u002Fb><b>Medium 500<\u002Fb><b>Semibold 600<\u002Fb><b>Italic<\u002Fb><\u002Fdiv>\n        <p style=\"margin-top:12px;font-size:11px;\">One serif moment per screen. Short, confident headlines of six to nine words. Italic — often in Heritage Sand — for emphasis.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"type-spec\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;\"><span class=\"ey\" style=\"color:var(--brass-600);\">Sans — body, UI &amp; all numerals<\u002Fspan><span class=\"sans-cap\">Poppins<\u002Fspan><\u002Fdiv>\n        <div class=\"big sans\" style=\"margin-top:10px;\">Three nights, R 14,500<\u002Fdiv>\n        <div class=\"row\"><b>Regular 400<\u002Fb><b>Medium 500<\u002Fb><b>Semibold 600<\u002Fb><b>Bold 700<\u002Fb><\u002Fdiv>\n        <p style=\"margin-top:12px;font-size:11px;\">Body copy, navigation, captions — and <strong>all numerals<\u002Fstrong>, even inside serif paragraphs (Poppins Medium, tabular figures). Prices in Rand: R 14,500.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\" style=\"margin-top:18px;\"><p><strong>Only these two typefaces.<\u002Fstrong> Never substitute Arial, Times, or a decorative font. If Lora or Poppins is unavailable in an app, use the nearest system serif / sans and correct it in the final artwork.<\u002Fp><\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>14<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 15 · TYPE SCALE ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Type — scale &amp; rules\">\n    <div class=\"rhead\"><span class=\"sans-cap\">03 · Typography<\u002Fspan><span class=\"sans-cap\">Scale &amp; rules<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Hierarchy<\u002Fp>\n    <h2 class=\"h-page\">Type scale &amp; rules<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <div style=\"margin-top:16px;\">\n      <div class=\"scale-row\"><span style=\"font-family:var(--serif);font-size:34px;color:var(--ink);\">Display<\u002Fspan><span class=\"lbl\">Lora Medium · headlines<\u002Fspan><\u002Fdiv>\n      <div class=\"scale-row\"><span style=\"font-family:var(--serif);font-size:24px;color:var(--ink);\">Heading<\u002Fspan><span class=\"lbl\">Lora · section titles<\u002Fspan><\u002Fdiv>\n      <div class=\"scale-row\"><span style=\"font-family:var(--serif);font-size:18px;color:var(--ink);\">Subheading<\u002Fspan><span class=\"lbl\">Lora · sub-sections<\u002Fspan><\u002Fdiv>\n      <div class=\"scale-row\"><span style=\"font-family:var(--sans);font-size:13px;color:var(--ink);\">Body copy — Poppins Regular set at a 60–75 character measure for comfortable reading.<\u002Fspan><span class=\"lbl\">Poppins · body<\u002Fspan><\u002Fdiv>\n      <div class=\"scale-row\"><span style=\"font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brass-600);\">Eyebrow · tracked caps<\u002Fspan><span class=\"lbl\">Poppins · labels<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dd\" style=\"margin-top:24px;\">\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Do<\u002Fb><\u002Fdiv>\n        <ul><li>Keep headlines short — six to nine words<\u002Fli><li>Hold body to a 60–75 character line<\u002Fli><li>Set numerals in Poppins, even within serif text<\u002Fli><li>Use tracked caps only for eyebrows &amp; labels<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Don't<\u002Fb><\u002Fdiv>\n        <ul><li>Set tracked caps as body text<\u002Fli><li>Use type below ~9 pt for labels<\u002Fli><li>Run more than one serif headline per view<\u002Fli><li>Use exclamation points<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>15<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 16 · DIVIDER: VOICE ============ -->\n  <section class=\"sheet dark divider\" data-screen-label=\"Divider — Voice &amp; Imagery\">\n    <div class=\"dnum\">04<\u002Fdiv>\n    <h1>Voice &amp;<br>Imagery<\u002Fh1>\n    <div class=\"cover-rule\" style=\"margin:22px 0 0;\"><\u002Fdiv>\n    <div class=\"dlist\">\n      <div class=\"di\"><b>17<\u002Fb><span>How we write — voice &amp; tone<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>18<\u002Fb><span>Photography direction<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dtag\"><span>African Safari Group<\u002Fspan><span>Brand Guidelines 2026<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 17 · VOICE ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Voice &amp; tone\">\n    <div class=\"rhead\"><span class=\"sans-cap\">04 · Voice &amp; Imagery<\u002Fspan><span class=\"sans-cap\">Voice &amp; tone<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">How we write<\u002Fp>\n    <h2 class=\"h-page\">Voice &amp; tone<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:14px;\">We write like the specialist a client is grateful to have found — <strong>authoritative, warm, restrained.<\u002Fstrong> Confidence shows through precision, never volume.<\u002Fp>\n    <div class=\"dd\" style=\"margin-top:18px;\">\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Instead of<\u002Fb><\u002Fdiv>\n        <p class=\"serif-it\" style=\"font-size:14px;color:var(--soft);\">\"Experience the adventure of a lifetime on this dream safari!\"<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Write<\u002Fb><\u002Fdiv>\n        <p class=\"serif-it\" style=\"font-size:14px;color:var(--ink);\">\"Sabi Sand has the highest leopard-sighting density in Africa. Three nights gives you the best odds.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"col2\" style=\"margin-top:22px;\">\n      <div class=\"stack\">\n        <p class=\"sans-cap\" style=\"margin-bottom:4px;\">Principles<\u002Fp>\n        <p style=\"font-size:11.5px;\"><strong>Specific over superlative.<\u002Fstrong> Name the lodge, the season, the sighting odds — not \"unforgettable\" or \"dream\".<\u002Fp>\n        <p style=\"font-size:11.5px;\"><strong>Declarative sentences.<\u002Fstrong> Short, certain statements.<\u002Fp>\n        <p style=\"font-size:11.5px;\"><strong>A person, not a funnel.<\u002Fstrong> Consultation-led, never transactional. Lead with what the guest experiences.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stack\">\n        <p class=\"sans-cap\" style=\"margin-bottom:4px;\">Mechanics<\u002Fp>\n        <p style=\"font-size:11.5px;\"><strong>\"We\" and \"you\".<\u002Fstrong> First person plural for us; address the guest directly.<\u002Fp>\n        <p style=\"font-size:11.5px;\"><strong>No exclamation points.<\u002Fstrong> Calm confidence outperforms enthusiasm.<\u002Fp>\n        <p style=\"font-size:11.5px;\"><strong>No emoji, ever.<\u002Fstrong> Numerals carry weight — prices, night counts, reply times, sighting percentages.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>17<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 18 · PHOTOGRAPHY ============ -->\n  <section class=\"sheet pad\" data-screen-label=\"Photography\">\n    <div class=\"rhead\"><span class=\"sans-cap\">04 · Voice &amp; Imagery<\u002Fspan><span class=\"sans-cap\">Photography<\u002Fspan><\u002Fdiv>\n    <p class=\"ey\">Imagery<\u002Fp>\n    <h2 class=\"h-page\">Photography direction<\u002Fh2>\n    <div class=\"rule\"><\u002Fdiv>\n    <p style=\"margin-top:14px;\">Photography carries more of this brand than any single design element. The direction is <strong>cinematic and restrained<\u002Fstrong> — one clear subject, real negative space, a warm, slightly desaturated grade.<\u002Fp>\n    <div class=\"col2\" style=\"margin-top:16px;gap:14px;\">\n      <div class=\"pslot\" style=\"height:120px;\"><span>Golden-hour wildlife<br>one clear subject<\u002Fspan><\u002Fdiv>\n      <div class=\"pslot\" style=\"height:120px;\"><span>Wide environmental lodge<br>with negative space<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dd\" style=\"margin-top:20px;\">\n      <div class=\"dd-card dd-do\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M4 12l5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Do<\u002Fb><\u002Fdiv>\n        <ul><li>Shoot at golden hour, one clear subject<\u002Fli><li>Leave real negative space in frame<\u002Fli><li>Keep a consistent warm, slightly desaturated grade<\u002Fli><li>Place any text over a dark bottom-up scrim<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dd-card dd-no\">\n        <div class=\"dd-h\"><span class=\"dd-badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Don't<\u002Fb><\u002Fdiv>\n        <ul><li>Use flat midday light or crowded grids<\u002Fli><li>Use generic OTA / stock imagery<\u002Fli><li>Over-saturate — neon grass, orange HDR skies<\u002Fli><li>Cram text over busy detail<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span>African Safari Group<\u002Fspan><span>18<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 19 · DIVIDER: APPLICATIONS ============ -->\n  <section class=\"sheet dark divider\" data-screen-label=\"Divider — Applications\">\n    <div class=\"dnum\">05<\u002Fdiv>\n    <h1>Applications<\u002Fh1>\n    <div class=\"cover-rule\" style=\"margin:22px 0 0;\"><\u002Fdiv>\n    <div class=\"dlist\">\n      <div class=\"di\"><b>20<\u002Fb><span>Stationery — letterhead &amp; compliment slip<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>21<\u002Fb><span>Business cards<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>22<\u002Fb><span>Folders, files &amp; documents<\u002Fspan><\u002Fdiv>\n      <div class=\"di\"><b>23<\
